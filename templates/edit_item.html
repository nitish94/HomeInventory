<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0"><i class="fas fa-edit"></i> Edit Item</h3>
                    </div>
                    <div class="card-body">
                        <form action="/edit-item/{{.ID}}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label"><i class="fas fa-box"></i> Item Name</label>
                                <input type="text" class="form-control form-control-lg" id="name" name="name" value="{{.Name}}" required>
                            </div>
                            <div class="mb-3">
                                <label for="count" class="form-label"><i class="fas fa-hashtag"></i> Quantity</label>
                                <input type="number" class="form-control form-control-lg" id="count" name="count" value="{{.Count}}" min="0" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Update Item</button>
                                <a href="/" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back to Inventory</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
